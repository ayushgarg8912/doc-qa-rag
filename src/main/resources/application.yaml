server:
  port: ${PORT:8080}

spring:
  application:
    name: doc-qa-rag

  # PostgreSQL (with pgvector). Defaults match docker-compose.yml.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docqa}
    username: ${SPRING_DATASOURCE_USERNAME:docqa}
    password: ${SPRING_DATASOURCE_PASSWORD:docqa}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    model:
      # Both chat and embeddings come from the OpenAI-compatible API
      # (one key, one base URL — see below).
      chat: openai
      embedding: openai

    openai:
      # Point this at an OpenAI-compatible endpoint that serves BOTH chat
      # completions and embeddings, e.g. OpenRouter:
      #   OPENAI_BASE_URL=https://openrouter.ai/api/v1
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      # Placeholder default lets the app start (and /api/health work) without a key;
      # AI calls will fail cleanly with a 502 until a real key is provided.
      api-key: ${OPENAI_API_KEY:demo-key-not-set}
      chat:
        # Spring AI 1.0.0's default completions path is /v1/chat/completions,
        # which would double the /v1 when the base URL already ends in /v1
        # (e.g. OpenRouter). Pin the version-relative path instead.
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.3
      embedding:
        # Same double-/v1 issue as chat: the 1.0.0 default embeddings path
        # is /v1/embeddings, so pin the version-relative path.
        embeddings-path: /embeddings
        options:
          # Free NVIDIA Nemotron embedding model on OpenRouter (2048 dims).
          model: ${EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b:free}

    vectorstore:
      pgvector:
        initialize-schema: true
        # Must match the embedding model's output size (Nemotron embed = 2048).
        dimensions: ${EMBEDDING_DIMENSIONS:2048}
        index-type: NONE
        distance-type: COSINE_DISTANCE

logging:
  level:
    com.ayushgarg.docqa: INFO
