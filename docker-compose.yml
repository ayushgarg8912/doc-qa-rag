# Runs the whole stack: the Spring Boot app + PostgreSQL with pgvector.
#
#   # Chat via Groq's free tier (embeddings are local and need no key):
#   OPENAI_API_KEY=gsk_... OPENAI_BASE_URL=https://api.groq.com/openai/v1 AI_MODEL=llama-3.3-70b-versatile docker compose up --build
#
# Then open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docqa
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Chat model: any OpenAI-compatible API. Defaults work with OpenAI;
      # override the three values to use Groq (free) or another provider.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/docqa
      SPRING_DATASOURCE_USERNAME: docqa
      SPRING_DATASOURCE_PASSWORD: docqa
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
