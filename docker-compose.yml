# Runs the whole stack: the Spring Boot app + PostgreSQL with pgvector.
#
#   # Chat AND embeddings via OpenRouter (one key; free models by default):
#   OPENAI_API_KEY=sk-or-... docker compose up --build
#
# Then open http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docqa
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # One OpenAI-compatible API serves both chat and embeddings.
      # Defaults target OpenRouter's free models (an OpenRouter key is
      # required); override to use another provider that offers embeddings.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/docqa
      SPRING_DATASOURCE_USERNAME: docqa
      SPRING_DATASOURCE_PASSWORD: docqa
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
